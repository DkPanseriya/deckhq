<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DeckHQ: an agent's head, visor and antenna">
  <title>DeckHQ - the agent</title>
  <style>
    svg{--plate:#14161B;--edge:#2A2E39;--form:#E9ECF2;--dim:#79808E;--deep:#14161B;--accent:#E4A44E}
    @media (prefers-color-scheme:light){svg{--plate:#F4F2ED;--edge:#D8D3C8;--form:#1B1E25;--dim:#8C93A0;--deep:#F4F2ED;--accent:#B5731A}}
    svg.dark{--plate:#14161B;--edge:#2A2E39;--form:#E9ECF2;--dim:#79808E;--deep:#14161B;--accent:#E4A44E}
    svg.light{--plate:#F4F2ED;--edge:#D8D3C8;--form:#1B1E25;--dim:#8C93A0;--deep:#F4F2ED;--accent:#B5731A}
  </style>

  <rect width="512" height="512" rx="112" fill="var(--plate)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="var(--edge)" stroke-width="12"/>

  <!-- Antenna: stem, then the tip that carries the only colour. Shortened, so
       the head can grow into the space the old stalk was wasting. -->
  <rect x="236" y="106" width="40" height="76" rx="20" fill="var(--dim)"/>
  <circle cx="256" cy="92" r="44" fill="var(--accent)"/>

  <!-- Head. Was 360x292 sitting in a 512 plate with the mass reading around
       70%; now 424x300, and the ears are gone - they were 1.1px at 16 and were
       only ever stealing the width the head needed. Ink now spans 44..468
       across and 48..470 down: 83% and 82% of the box. -->
  <rect x="44" y="170" width="424" height="300" rx="104" fill="var(--form)"/>

  <!-- Visor, high in the face so it reads as eyes, not a mouth -->
  <rect x="104" y="232" width="304" height="118" rx="59" fill="var(--deep)"/>
</svg>
