<!doctype html>
<meta charset="utf-8">
<title>sheet</title>
<style>html,body{margin:0;padding:0;background:#EFEAE0;overflow:hidden}canvas{display:block}</style>
<canvas id="cv" width="1400" height="1052"></canvas>
<script src="lib.js"></script>
<script src="sheet.js"></script>
<script>
var key = (new URLSearchParams(location.search).get('c') || 'A').toUpperCase();
var img = new Image();
img.onload = function () {
  var ctx = document.getElementById('cv').getContext('2d');
  try { renderSheet(ctx, key, img); }
  catch (e) { document.title = 'ERR: ' + e.message; ctx.fillStyle='#C0392B'; ctx.font='16px monospace'; ctx.fillText('ERR '+e.message, 20, 900); console.error(e); }
  document.body.setAttribute('data-done', '1');
};
img.onerror = function(){ document.title = 'ERR: image'; };
img.src = 'floor.png';
</script>
