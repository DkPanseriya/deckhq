<!doctype html>
<meta charset="utf-8">
<title>crew</title>
<style>html,body{margin:0;padding:0;background:#EFEAE0;overflow:hidden}canvas{display:block}</style>
<canvas id="cv" width="1440" height="900"></canvas>
<script src="../design/character/lib.js"></script>
<script src="motion.js"></script>
<script src="crew.js"></script>
<script>
var q = new URLSearchParams(location.search);
var mode = q.get('mode') === 'gif' ? 'gif' : 'sheet';
var p = Number(q.get('p') || 0) || 0;
var cv = document.getElementById('cv');
if (mode === 'gif') { cv.width = 760; cv.height = 470; }
var ctx = cv.getContext('2d');
try { renderCrew(ctx, p, mode); }
catch (e) { document.title = 'ERR: ' + e.message; console.error(e); ctx.fillStyle = '#C0392B'; ctx.font = '14px monospace'; ctx.fillText('ERR ' + e.message, 20, 20); }
document.body.setAttribute('data-done', '1');
</script>
