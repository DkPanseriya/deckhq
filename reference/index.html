<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">DeckHQ</span>
    <span class="brand-tag">command deck</span>
  </div>

  <div class="stats" id="stats" aria-live="polite">
    <div class="stat stat--accent">
      <span class="stat-v" id="s-owed">–</span>
      <span class="stat-k">owe you</span>
    </div>
    <div class="stat stat--accent">
      <span class="stat-v" id="s-oldest">–</span>
      <span class="stat-k">oldest</span>
    </div>
    <div class="stat">
      <span class="stat-v" id="s-floor">–</span>
      <span class="stat-k">at bench</span>
    </div>
    <div class="stat">
      <span class="stat-v" id="s-live">–</span>
      <span class="stat-k">on bench</span>
    </div>
  </div>

  <div class="tools">
    <div class="segmented" id="skin-picker" role="group" aria-label="Visual style">
      <button class="btn seg" data-skin="studio" aria-pressed="true">Studio</button>
      <button class="btn seg" data-skin="pixel" aria-pressed="false">Pixel</button>
      <button class="btn seg" data-skin="iso" aria-pressed="false">Isometric</button>
      <button class="btn seg" data-skin="blueprint" aria-pressed="false">Blueprint</button>
    </div>
    <button class="btn" id="b-fired" aria-pressed="false">Show let go</button>
    <button class="btn" id="b-refresh">
      <span class="btn-label">Refresh</span>
    </button>
  </div>
</header>

<main class="app" id="app">
  <section class="stage" aria-label="Office floor">
    <canvas id="floor" width="1008" height="700" role="img"
            aria-label="Top-down office floor plan with your Claude Code sessions"></canvas>
    <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>
    <div class="stage-empty" id="stage-empty" hidden>
      <h2>No sessions on the floor</h2>
      <p>Start a Claude Code session in any project and it appears here within a few seconds.
         Sessions you have not touched in two weeks are archived — use <b>Show archived</b> to bring them back.</p>
      <code>claude</code>
    </div>
  </section>

  <aside class="dock" id="dock" aria-label="Session detail" hidden>
    <header class="dock-head">
      <div class="dock-title-row">
        <h2 class="dock-title" id="d-title">—</h2>
        <button class="icon-btn" id="d-close" aria-label="Close panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="dock-meta" id="d-meta"></div>
      <div class="dock-facts" id="d-facts"></div>
      <div class="dock-actions" id="d-actions"></div>
    </header>

    <div class="thread" id="d-thread" tabindex="0" aria-label="Conversation"></div>

    <form class="composer" id="d-form">
      <label class="sr-only" for="d-input">Message this session</label>
      <textarea id="d-input" rows="2" placeholder="Reply to this session…"></textarea>
      <div class="composer-row">
        <span class="composer-hint" id="d-hint"></span>
        <button class="btn btn--primary" id="d-send" type="submit">Send</button>
      </div>
    </form>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
