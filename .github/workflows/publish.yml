name: Publish

# Publishes to npm when a v* tag is pushed, using trusted publishing (OIDC).
#
# There is no npm token here, and there is no NPM_TOKEN secret. GitHub mints a
# short-lived OIDC credential for this specific repository and this specific
# workflow file, and npm verifies it against the trusted publisher configured
# on the package. Nothing long-lived exists to leak, and npm is restricting
# 2FA-bypass tokens anyway: account changes from August 2026, direct publishing
# from January 2027.
#
# Provenance is automatic under trusted publishing — do not add --provenance,
# it is implied.
#
# Two prerequisites, both one-time, both done by the repository owner:
#
#   1. The FIRST version must be published from a terminal. npm requires a
#      package to exist before a trusted publisher can be added to it, so OIDC
#      cannot bootstrap a brand new name. Run `npm publish --access public`
#      once, locally, and authenticate in the browser when prompted.
#
#   2. Then, on npmjs.com: the package -> Settings -> Trusted publisher.
#        Organization or user:  DkPanseriya
#        Repository:            deckhq
#        Workflow filename:     publish.yml
#        Environment:           (leave empty)
#        Allowed actions:       npm publish
#
# After that, every release is `git push origin vX.Y.Z` and nothing else.
#
# The publish is gated on the full test matrix passing first, so a tag on a
# broken commit cannot reach the registry.

on:
  push:
    tags: ['v*']

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev tooling
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish
      # credential. Without it the publish falls back to looking for a token
      # that does not exist, and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        # Trusted publishing needs npm >= 11.5.1, and Node 22 still ships 10.x.
        run: npm install -g npm@latest

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: Refuse to publish if the tag and package.json disagree
        # A tag reading v1.3.0 on a commit whose package.json says 1.2.0 would
        # publish the wrong bytes under the right name, and the registry does
        # not let you take that back.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG npm=$(npm --version)"
          test "$TAG" = "$PKG"

      - name: Publish
        # No token, and no --provenance: trusted publishing supplies both.
        # prepublishOnly runs lint and the full suite again here.
        run: npm publish --access public
