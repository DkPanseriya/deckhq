name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseding a push is only ever right on a branch somebody is iterating on.
# Keyed on the ref for a pull request, so a second push to a PR cancels the
# first; keyed on the commit for a push to `main`, so every merge gets its own
# group and runs to completion. Grouping `main` by ref would have been worse
# than the cancellation it fixes: back-to-back merges would queue behind each
# other and the history would still have runs with no verdict on them.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    # The suite is about 5 s. This is a hang guard for a test that waits on a
    # socket or a child that never exits, not a budget.
    #
    # It has fired once, and reading the result took a while, so: **a job the
    # runner kills at this timeout is recorded as `cancelled`, not `failed`,
    # and one cancelled job makes the whole RUN `cancelled`** — even when five
    # of its siblings failed with real assertions. A run summary that says
    # "cancelled" is therefore not evidence that something cancelled it, and in
    # particular is not evidence about the `concurrency` block above. Read the
    # per-job conclusions. See DEVIATIONS.md §121.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev tooling
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test

  # Type checking: `tsc --noEmit --checkJs` over the JSDoc that was already
  # there and unchecked (01-AUDIT.md F21, WP-22).
  #
  # Ubuntu only, and once. Unlike the suite, the checker's answer cannot differ
  # by platform or by Node version: it reads the same source with the same
  # compiler and the same hand-written ambient types (`types/`), so nine copies
  # of it would be nine copies of the same verdict. It runs AFTER lint in the
  # job list for the same reason lint runs before the tests — the cheapest,
  # most localised failure should be the one you read first.
  #
  # Two projects, because the two halves of the static-file boundary do not
  # share a platform: the root `tsconfig.json` is Node and `public/` is a
  # browser. `npm run typecheck` runs both.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev tooling
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  # Visual regression: golden PNGs of the demo floor per fixture population,
  # compared pixel for pixel (scripts/goldens.mjs).
  #
  # Ubuntu only, and Node 22 only. Goldens are per platform because text is
  # rasterised by the OS, so one set cannot serve three; the ubuntu runner
  # image ships Google Chrome; and the CDP client needs the global WebSocket
  # Node only has unflagged from 22.
  #
  # No install step: the harness is zero-dependency by design — node builtins,
  # our own PNG codec over node:zlib, and a Chrome the runner already has. That
  # is worth ~15 s of the budget below.
  #
  # Three tooling gaps are skips rather than failures, because a red build on a
  # missing browser teaches people to ignore the gate: no WebSocket, no Chrome,
  # and a Chrome that will not start (each says so and exits 0); plus no
  # goldens committed for this platform yet — see DEVIATIONS.md §87 and §114,
  # this is the state linux is in today. In every case the fresh captures are
  # uploaded below, which is how the first linux set gets generated and
  # committed.
  #
  # Budget: WP-21 asks for under 90 s. Measured 26-28 s for all four
  # populations on a Windows laptop; the timeout is a hang guard, not the
  # budget. It is 8 minutes rather than 4 because the launch now retries three
  # times against a 60 s target wait, and the whole point of that path is to
  # reach the SKIPPED line — a job the runner kills at the timeout has failed,
  # which is the outcome §87 promised it would not have.
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check goldens
        run: npm run goldens:check
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Failed captures with their diff images, or — while this platform
          # has no committed set — the captures to commit as the first one.
          name: goldens-linux
          path: test/goldens/.out/
          if-no-files-found: ignore
          retention-days: 14
